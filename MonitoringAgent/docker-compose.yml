services:
  mcp-gold:
    build:
      context: .
      dockerfile: services/mcp_gold/Dockerfile
    environment:
      GOLD_MODE: ${GOLD_MODE:-stub}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-}
      AIRFLOW_TOKEN: ${AIRFLOW_TOKEN:-}
    ports:
      - "8001:8001"

  mcp-relex-generix:
    build:
      context: .
      dockerfile: services/mcp_relex_generix/Dockerfile
    environment:
      RELEX_MODE: ${RELEX_MODE:-stub}
      GENERIX_MODE: ${GENERIX_MODE:-stub}
      RELEX_BASE_URL: ${RELEX_BASE_URL:-}
      RELEX_OTEL_URL: ${RELEX_OTEL_URL:-}
      RELEX_OAUTH_TOKEN_URL: ${RELEX_OAUTH_TOKEN_URL:-}
      RELEX_CLIENT_ID: ${RELEX_CLIENT_ID:-}
      RELEX_CLIENT_SECRET: ${RELEX_CLIENT_SECRET:-}
      RELEX_API_KEY: ${RELEX_API_KEY:-}
      GENERIX_BASE_URL: ${GENERIX_BASE_URL:-}
      GENERIX_API_KEY: ${GENERIX_API_KEY:-}
    ports:
      - "8002:8002"

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      MCP_GOLD_URL: http://mcp-gold:8001/mcp
      MCP_RELEX_GENERIX_URL: http://mcp-relex-generix:8002/mcp
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    depends_on:
      - mcp-gold
      - mcp-relex-generix
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - agent
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # Consommé par contactpoints.yaml via $__env{TEAMS_WEBHOOK_URL} —
      # laisser vide désactive de fait l'alerte (Grafana n'enverra rien
      # vers une URL vide, l'erreur reste locale aux logs Grafana).
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
